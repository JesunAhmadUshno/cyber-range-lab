name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Unit and layout tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Hardening checker run (baseline)
        run: python src/run_learn.py
      - name: Detection loop run
        run: python src/run_build.py
      - name: Hardened loop run
        run: python src/run_deep.py
      - name: Threshold sweep and authored-intent check
        run: python src/evaluate_deep.py
      - name: Results regenerate unchanged from experiments/
        run: git diff --exit-code results/
